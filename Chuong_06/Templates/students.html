<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Danh sách sinh viên</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            padding: 30px 15px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            padding: 30px;
        }
        h2 {
            color: #1a252f;
            margin-bottom: 25px;
            border-bottom: 2px solid #3498db;
            padding-bottom: 10px;
        }
        .card {
            background-color: #f8f9fa;
            border-left: 5px solid #3498db;
            padding: 15px 20px;
            margin-bottom: 15px;
            border-radius: 4px;
        }
        .card strong {
            color: #2c3e50;
        }
        .card-title {
            font-size: 1.05rem;
            margin-bottom: 5px;
            display: block;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            padding: 10px 12px;
            border: 1px solid #dee2e6;
            text-align: left;
        }
        th {
            background-color: #e9ecef;
            color: #495057;
        }
        tr:nth-child(even) {
            background-color: #ffffff;
        }
        .badge {
            background-color: #27ae60;
            color: white;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: bold;
        }
        .badge-none {
            background-color: #e74c3c;
        }
        ul {
            margin-left: 20px;
            margin-top: 5px;
        }
        li {
            margin-bottom: 4px;
        }
    </style>
</head>
<body>
    <h2>Danh sách Sinh viên</h2>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>MSSV</th>
                <th>Họ và tên</th>
                <th>Điểm GPA</th>
            </tr>
        </thead>
        <tbody>
            {% for sv in students %}
            <tr>
                <td>{{ sv.id }}</td>
                <td>{{ sv.mssv }}</td>
                <td>{{ sv.name }}</td>
                <td>{{ sv.gpa }}</td>
            </tr>
            {% else %}
            <tr>
                <td colspan="4">Chưa có sinh viên nào trong danh sách.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
