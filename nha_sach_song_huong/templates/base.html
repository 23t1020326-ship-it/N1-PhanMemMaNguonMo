<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Nhà sách Sông Hương{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body { background-color: #f8f9fa; }
        .navbar-custom { background-color: #0b396b; }
        .badge-cart {
            background-color: #f37021;
            color: white;
            font-size: 0.8rem;
            border-radius: 50%;
            padding: 3px 7px;
            margin-left: 4px;
        }
        .book-cover-placeholder {
            height: 160px;
            background-color: #e9ecef;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #6c757d;
            border-radius: 6px;
            overflow: hidden;
        }
        .book-cover-placeholder img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>
<body>
    <!-- Thanh menu điều hướng -->
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom py-3">
        <div class="container">
            <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="{{ url_for('store_books') }}">
                <i class="bi bi-book-half"></i> Nhà sách Sông Hương
            </a>
            <div class="d-flex align-items-center gap-4">
                <a class="text-white text-decoration-none fw-semibold" href="{{ url_for('store_books') }}">Sách</a>
                <a class="text-white text-decoration-none fw-semibold d-flex align-items-center" href="{{ url_for('store_cart') }}">
                    <i class="bi bi-cart3 me-1"></i> Giỏ hàng
                    <span class="badge-cart">{{ cart_count }}</span>
                </a>
                <a class="text-white-50 text-decoration-none small" href="/admin" title="Trang quản trị">
                    <i class="bi bi-gear"></i>
                </a>
            </div>
        </div>
    </nav>

    <!-- Vùng nội dung chính & Thông báo Flash -->
    <div class="container my-4">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
