<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Quản lý Sách{% endblock %}</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f7f6; color: #333; }
        
        /* Cấu hình Thanh Menu Điều Hướng */
        nav { 
            background: #2c3e50; 
            padding: 15px 30px; 
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        nav h1 {
            color: #ffffff;
            font-size: 1.5rem;
            margin: 0;
        }
        .nav-links {
            display: flex;
            gap: 20px;
        }
        .nav-links a { 
            color: #ecf0f1; 
            text-decoration: none; 
            font-weight: bold; 
            font-size: 1rem;
            transition: all 0.3s ease;
            padding: 6px 12px;
            border-radius: 4px;
        }
        .nav-links a:hover { 
            color: #3498db; 
        }

        /* Class dành riêng cho Menu đang được chọn (Active Page) */
        .nav-links a.active {
            color: #f1c40f;              /* Đổi màu chữ sang vàng nổi bật */
            background-color: rgba(255, 255, 255, 0.1); /* Nền mờ nhẹ */
            border-bottom: 2px solid #f1c40f;
        }

        .container { max-width: 1000px; margin: 30px auto; background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        h2 { margin-bottom: 20px; color: #2c3e50; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background-color: #e9ecef; }
        .form-group { margin-bottom: 12px; }
        input, select, textarea { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        .btn { padding: 8px 12px; border: none; border-radius: 4px; cursor: pointer; text-decoration: none; font-size: 0.9rem; }
        .btn-primary { background: #3498db; color: white; }
        .btn-danger { background: #e74c3c; color: white; }
        .btn-warning { background: #f39c12; color: white; }
        .card-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 30px; }
        .card { background: #ecf0f1; padding: 20px; border-radius: 6px; text-align: center; }
        .card h3 { font-size: 2rem; color: #2980b9; }
        .actions { display: flex; gap: 5px; }
    </style>
</head>
<body>
    <nav>
        <h1>Quản lý Sách</h1>
        <div class="nav-links">
            <a href="{{ url_for('dashboard') }}" class="{% if request.endpoint == 'dashboard' %}active{% endif %}">📊 Dashboard</a>
            <a href="{{ url_for('list_categories') }}" class="{% if request.endpoint == 'list_categories' %}active{% endif %}">📁 Danh mục Sách</a>
            <a href="{{ url_for('list_books') }}" class="{% if request.endpoint == 'list_books' %}active{% endif %}">📚 Quản lý Sách</a>
        </div>
    </nav>
    
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
